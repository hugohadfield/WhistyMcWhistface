name: Bid-aware 3-card evaluation

on:
  push:
    branches: ['feature/bid-aware-three-card-20261102']
  pull_request:

jobs:
  policy-and-tournament:
    name: Bid-aware 3 integration and matched tournaments
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit, differential and full-game tests
        run: |
          python -m pytest -v tests/test_bid_aware_3_player.py tests/test_bid_aware_2_player.py
      - name: Three players - new 3-card policy versus existing 2-card policy
        run: |
          python -m benchmarks.bid_aware_3_tournament \
            --players 3 --baseline aware2 --games 600 --workers 4 \
            --seed 20261125 --progress-every 60 \
            --json bid-aware-3-results/three-vs-two-3p.json \
            --csv bid-aware-3-results/three-vs-two-3p.csv
      - name: Two players - new 3-card policy versus existing 2-card policy
        run: |
          python -m benchmarks.bid_aware_3_tournament \
            --players 2 --baseline aware2 --games 400 --workers 4 \
            --seed 20261126 --progress-every 40 \
            --json bid-aware-3-results/three-vs-two-2p.json \
            --csv bid-aware-3-results/three-vs-two-2p.csv
      - name: Three players - new 3-card policy versus random
        run: |
          python -m benchmarks.bid_aware_3_tournament \
            --players 3 --baseline random --games 600 --workers 4 \
            --seed 20261127 --progress-every 60 \
            --json bid-aware-3-results/three-vs-random-3p.json \
            --csv bid-aware-3-results/three-vs-random-3p.csv
      - name: Two players - new 3-card policy versus random
        run: |
          python -m benchmarks.bid_aware_3_tournament \
            --players 2 --baseline random --games 400 --workers 4 \
            --seed 20261128 --progress-every 40 \
            --json bid-aware-3-results/three-vs-random-2p.json \
            --csv bid-aware-3-results/three-vs-random-2p.csv
      - name: Archive detailed per-game scores and summary statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bid-aware-3-comparisons
          path: bid-aware-3-results/
          if-no-files-found: warn
          retention-days: 30
