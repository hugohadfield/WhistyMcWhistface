name: Whist regression tests
on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Benchmark rollout throughput
        run: |
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 7
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 3
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 1
      - name: Benchmark complete AI versus random 13-round matches
        run: |
          python -m benchmarks.full_game --rollouts 16 128 1024 --bots MonteCarloPlayer SnakeMonteCarloPlayer
      - name: Profile a complete 1024-rollout Monte Carlo game
        if: github.event_name == 'pull_request' && github.head_ref == 'experiment/profile-full-game-1024'
        run: python -m benchmarks.profile_full_game --rollouts 1024 --seat 0 --seed 20261031 --limit 24 --output /tmp/whist-full-game.prof
      - name: Save cProfile run for inspection
        if: github.event_name == 'pull_request' && github.head_ref == 'experiment/profile-full-game-1024'
        uses: actions/upload-artifact@v4
        with:
          name: whist-full-game-cprofile
          path: /tmp/whist-full-game.prof
          retention-days: 14
      - name: Report per-card scoring convergence
        run: |
          python -m benchmarks.score_convergence --scenario early --rollouts 16 64 256 1024 4096 --reference 8192
          python -m benchmarks.score_convergence --scenario mid --rollouts 16 64 256 1024 4096 --reference 8192

