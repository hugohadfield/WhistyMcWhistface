name: Whist regression tests
on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Benchmark rollout throughput
        run: |
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 7
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 3
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 1
      - name: Benchmark complete AI versus random 13-round matches
        run: |
          python -m benchmarks.full_game --rollouts 16 128 1024 --bots MonteCarloPlayer SnakeMonteCarloPlayer
      - name: Report per-card scoring convergence
        run: |
          python -m benchmarks.score_convergence --scenario early --rollouts 16 64 256 1024 4096 --reference 8192
          python -m benchmarks.score_convergence --scenario mid --rollouts 16 64 256 1024 4096 --reference 8192
  matched_round_1024:
    name: Matched rounds 1024 vs ${{ matrix.opponents }} opponents
    if: github.event_name == 'pull_request' && github.head_ref == 'experiment/matched-round-1024-strong'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        opponents: [random, monte_carlo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run 1024-rollout matched-round experiment
        run: |
          python -m benchmarks.paired_round_policy --rounds-per-size 200 \
            --cards 3 4 5 6 7 --rollouts 1024 --players 3 --workers 4 \
            --seed 20262817 --opponents ${{ matrix.opponents }} \
            --csv paired-${{ matrix.opponents }}-1024.csv
      - name: Archive completed and partial matched-round data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-${{ matrix.opponents }}-1024-results
          path: paired-${{ matrix.opponents }}-1024.csv
          if-no-files-found: warn
          retention-days: 14

  neural_mlp_cpu:
    name: Neural MLP CPU checks
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/neural-value-mlp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install basic test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install PyTorch CPU
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Exercise neural encoder and actual MLP training/inference
        run: python -m pytest -q tests/test_learning_encoding.py tests/test_learning_model.py

  training_data_smoke:
    name: Training trace and histogram export smoke test
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/training-traces-and-mc-labels'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Generate real multi-policy games
        run: |
          python -m benchmarks.generate_training_games --games 2 \
            --seed 2026411 --players 3 --workers 2 \
            --agents random,mc_random,mc_aware --rollouts 8 \
            --output-dir training-example/traces
      - name: Generate supervised Monte Carlo training shards
        run: |
          python -m benchmarks.export_training_labels \
            --traces 'training-example/traces/*.jsonl' \
            --output-dir training-example/labeled \
            --policy bid_aware_2 --rollouts 32 --workers 2 \
            --max-states 40 --shard-size 10
      - name: Archive actual training samples and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-training-data-smoke
          path: training-example/
          if-no-files-found: warn
          retention-days: 14
