name: Whist regression tests
on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Benchmark rollout throughput
        run: |
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 7
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 3
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 1
      - name: Benchmark complete AI versus random 13-round matches
        run: |
          python -m benchmarks.full_game --rollouts 16 128 1024 --bots MonteCarloPlayer SnakeMonteCarloPlayer
      - name: Report per-card scoring convergence
        run: |
          python -m benchmarks.score_convergence --scenario early --rollouts 16 64 256 1024 4096 --reference 8192
          python -m benchmarks.score_convergence --scenario mid --rollouts 16 64 256 1024 4096 --reference 8192
  matched_round_1024:
    name: Matched rounds 1024 vs ${{ matrix.opponents }} opponents
    if: github.event_name == 'pull_request' && github.head_ref == 'experiment/matched-round-1024-strong'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        opponents: [random, monte_carlo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run 1024-rollout matched-round experiment
        run: |
          python -m benchmarks.paired_round_policy --rounds-per-size 200 \
            --cards 3 4 5 6 7 --rollouts 1024 --players 3 --workers 4 \
            --seed 20262817 --opponents ${{ matrix.opponents }} \
            --csv paired-${{ matrix.opponents }}-1024.csv
      - name: Archive completed and partial matched-round data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-${{ matrix.opponents }}-1024-results
          path: paired-${{ matrix.opponents }}-1024.csv
          if-no-files-found: warn
          retention-days: 14

  neural_mlp_cpu:
    name: Neural MLP CPU checks
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/neural-value-mlp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install basic test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install PyTorch CPU
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Exercise neural encoder and actual MLP training/inference
        run: python -m pytest -q tests/test_learning_encoding.py tests/test_learning_model.py

  training_data_smoke:
    name: Training trace and histogram export smoke test
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/training-traces-and-mc-labels'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Generate real multi-policy games
        run: |
          python -m benchmarks.generate_training_games --games 2 \
            --seed 2026411 --players 3 --workers 2 \
            --agents random,mc_random,mc_aware --rollouts 8 \
            --output-dir training-example/traces
      - name: Generate supervised Monte Carlo training shards
        run: |
          python -m benchmarks.export_training_labels \
            --traces 'training-example/traces/*.jsonl' \
            --output-dir training-example/labeled \
            --policy bid_aware_2 --rollouts 32 --workers 2 \
            --max-states 40 --shard-size 10
      - name: Archive actual training samples and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-training-data-smoke
          path: training-example/
          if-no-files-found: warn
          retention-days: 14

  parallel_training_labels:
    name: Parallel teacher labeling throughput and equivalence
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/persistent-parallel-label-export'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Generate representative decision traces
        run: |
          python -m benchmarks.generate_training_games --games 3 \
            --seed 20265117 --players 3 --workers 2 --agents random \
            --output-dir training-bench/traces
      - name: Baseline sequential Monte Carlo teacher
        run: |
          python -m benchmarks.export_training_labels \
            --traces 'training-bench/traces/*.jsonl' \
            --output-dir training-bench/serial --workers 1 \
            --rollouts 128 --max-states 80 --shard-size 16 \
            --seed 20265118
      - name: Persistent state-parallel Monte Carlo teacher
        run: |
          python -m benchmarks.export_training_labels \
            --traces 'training-bench/traces/*.jsonl' \
            --output-dir training-bench/parallel --workers 2 \
            --state-batch-size 4 --prefetch-batches 2 \
            --rollouts 128 --max-states 80 --shard-size 16 \
            --seed 20265118
      - name: Verify identical saved training arrays
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          a, b = Path('training-bench/serial'), Path('training-bench/parallel')
          left, right = sorted(p.name for p in a.glob('*.npz')), sorted(p.name for p in b.glob('*.npz'))
          assert left == right and left
          for name in left:
              with np.load(a/name) as x, np.load(b/name) as y:
                  assert x.files == y.files
                  for key in x.files:
                      np.testing.assert_array_equal(x[key], y[key])
          print('IDENTICAL_SERIAL_AND_PARALLEL_SHARDS', len(left), flush=True)
          PY
      - name: Archive benchmark samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-label-throughput-samples
          path: training-bench/
          if-no-files-found: warn
          retention-days: 14

  training_pipeline_profile:
    name: Profile training data collection and MC labeling
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/profile-training-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Profile real matches, labeling and concurrent throughput
        run: |
          python -m benchmarks.profile_training_pipeline \
            --output-dir training-profile \
            --behavior-rollouts 12 --teacher-rollouts 256 \
            --states-per-size 7 --workers 1 2 4 --seed 20266117
      - name: Show detailed cProfile hotspots and stage timing
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('training-profile')
          summary = json.loads((root/'profile-summary.json').read_text())
          print('PROFILE_SUMMARY', json.dumps(summary, indent=2))
          for name in ('random-game', 'mixed-game', 'teacher-cprofile'):
              print('\nHOTSPOTS', name)
              text = (root/f'{name}-top-functions.txt').read_text()
              print(text[:9000])
          for name in ('teacher-cprofile-stage-timing.json',
                       'teacher-timing-workers-1.json', 'teacher-timing-workers-2.json',
                       'teacher-timing-workers-4.json',
                       'game-timing/game-0000000.json',
                       'game-timing/game-0000001.json'):
              print('\nSTAGE_TIMING', name)
              print((root/name).read_text()[:12000])
          PY
      - name: Archive raw cProfile files and timing results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-training-pipeline-cpu-profile
          path: training-profile/
          if-no-files-found: warn
          retention-days: 14

  neural_training_end_to_end:
    name: Neural ML train/evaluate/tournament CPU smoke
    if: github.event_name == 'pull_request' && (github.head_ref == 'feature/train-evaluate-neural-policy' || github.head_ref == 'perf/resume-and-fast-label-rollouts-20261102')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run real-simulator neural learning integration tests
        run: python -m pytest -q tests/test_neural_train_evaluate.py tests/test_learning_model.py
      - name: Generate real independent game trajectories
        run: |
          python -m benchmarks.generate_training_games \
            --games 8 --seed 20262001 --players 3 --workers 2 \
            --agents random --output-dir ml-smoke/traces
      - name: Label every non-forced state using Monte Carlo
        run: |
          python -m benchmarks.export_training_labels \
            --traces 'ml-smoke/traces/*.jsonl' \
            --output-dir ml-smoke/labels --rollouts 16 \
            --policy random --seed 20262001 --workers 2 --shard-size 64
      - name: Train MLP with held-out early stopping
        run: |
          python -m benchmarks.train_value_model \
            --dataset ml-smoke/labels --output-dir ml-smoke/run \
            --device cpu --cpu-threads 2 --epochs 3 --patience 2 \
            --hidden-size 32 --residual-blocks 1 --batch-size 64
      - name: Report genuine held-out test metrics
        run: |
          python -m benchmarks.evaluate_value_model \
            --dataset ml-smoke/labels --checkpoint ml-smoke/run/best.pt \
            --split test --device cpu --output ml-smoke/test-metrics.json
      - name: Run neural vs MC complete same-deal seat-swap games
        run: |
          python -m benchmarks.neural_vs_monte_carlo \
            --checkpoint ml-smoke/run/best.pt --games 2 --rollouts 8 \
            --workers 2 --bootstrap 100 --device cpu \
            --csv ml-smoke/tournament.csv --json ml-smoke/tournament.json
      - name: Archive model checkpoints, metrics, traces and tournament
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whist-neural-end-to-end-smoke
          path: ml-smoke/
          if-no-files-found: warn
          retention-days: 14
