name: Whist regression tests
on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Benchmark rollout throughput
        run: |
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 7
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 3
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 1
      - name: Benchmark complete AI versus random 13-round matches
        run: |
          python -m benchmarks.full_game --rollouts 16 128 1024 --bots MonteCarloPlayer SnakeMonteCarloPlayer
      - name: Report per-card scoring convergence
        run: |
          python -m benchmarks.score_convergence --scenario early --rollouts 16 64 256 1024 4096 --reference 8192
          python -m benchmarks.score_convergence --scenario mid --rollouts 16 64 256 1024 4096 --reference 8192


      - name: Experimental 250-game paired endgame policy tournament
        if: github.event_name == 'pull_request' && github.head_ref == 'experiment/bid-aware-vs-random-tournament-250'
        timeout-minutes: 20
        run: |
          python -m benchmarks.endgame_policy_tournament --games 250 --rollouts 1024 --workers 4 --seed 20261301 --csv endgame-policy-250.csv
      - name: Archive experimental 250-game paired results
        if: github.event_name == 'pull_request' && github.head_ref == 'experiment/bid-aware-vs-random-tournament-250'
        uses: actions/upload-artifact@v4
        with:
          name: endgame-policy-250-raw-matches
          path: endgame-policy-250.csv
          retention-days: 14
