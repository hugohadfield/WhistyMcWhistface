name: Whist regression tests
on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Benchmark rollout throughput
        run: |
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 7
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 3
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 1
      - name: Benchmark complete AI versus random 13-round matches
        run: |
          python -m benchmarks.full_game --rollouts 16 128 1024 --bots MonteCarloPlayer SnakeMonteCarloPlayer
      - name: Run 250-game four-process trump tournament (125 fresh deal pairs)
        if: github.event_name == 'pull_request' && github.head_ref == 'experiment/250-games-four-concurrent'
        timeout-minutes: 25
        run: |
          python -c 'import os; print("TOURNAMENT_RUNNER_CPUS", os.cpu_count(), flush=True)'
          python -m benchmarks.trump_tournament --games 250 --workers 4 --rollouts 1024 --seed 20261056 --csv /tmp/trump-tournament-250.csv
      - name: Archive 250-game tournament CSV
        if: github.event_name == 'pull_request' && github.head_ref == 'experiment/250-games-four-concurrent'
        uses: actions/upload-artifact@v4
        with:
          name: trump-tournament-250-games
          path: /tmp/trump-tournament-250.csv
          retention-days: 14
      - name: Report per-card scoring convergence
        run: |
          python -m benchmarks.score_convergence --scenario early --rollouts 16 64 256 1024 4096 --reference 8192
          python -m benchmarks.score_convergence --scenario mid --rollouts 16 64 256 1024 4096 --reference 8192

