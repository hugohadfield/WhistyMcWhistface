name: Whist regression tests
on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Benchmark rollout throughput
        run: |
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 7
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 3
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 1
      - name: Benchmark complete AI versus random 13-round matches
        run: |
          python -m benchmarks.full_game --rollouts 16 128 1024 --bots MonteCarloPlayer SnakeMonteCarloPlayer
