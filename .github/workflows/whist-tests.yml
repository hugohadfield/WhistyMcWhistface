name: Whist regression tests
on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Benchmark rollout throughput
        run: |
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 7
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 3
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 1
      - name: Benchmark complete AI versus random 13-round matches
        run: |
          python -m benchmarks.full_game --rollouts 16 128 1024 --bots MonteCarloPlayer SnakeMonteCarloPlayer
      - name: Report per-card scoring convergence
        run: |
          python -m benchmarks.score_convergence --scenario early --rollouts 16 64 256 1024 4096 --reference 8192
          python -m benchmarks.score_convergence --scenario mid --rollouts 16 64 256 1024 4096 --reference 8192
      - name: Experimental matched-round policy A/B benchmark
        if: github.event_name == 'pull_request' && github.head_ref == 'experiment/matched-round-policy-benchmark'
        timeout-minutes: 20
        run: |
          python -m benchmarks.paired_round_policy --rounds-per-size 100 --cards 1 2 3 4 5 6 7 --rollouts 512 --players 3 --workers 4 --seed 20261102 --csv paired-round-policy.csv
      - name: Archive matched-round A/B results, including partial results on failure
        if: ${{ always() && github.event_name == 'pull_request' && github.head_ref == 'experiment/matched-round-policy-benchmark' }}
        uses: actions/upload-artifact@v4
        with:
          name: matched-round-policy-raw-results
          path: paired-round-policy.csv
          if-no-files-found: warn
          retention-days: 14
