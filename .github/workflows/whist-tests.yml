name: Whist regression tests
on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Benchmark rollout throughput
        run: |
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 7
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 3
          python -m benchmarks.rollouts --rollouts 80 --workers 1 --cards 1
      - name: Benchmark complete AI versus random 13-round matches
        run: |
          python -m benchmarks.full_game --rollouts 16 128 1024 --bots MonteCarloPlayer SnakeMonteCarloPlayer
      - name: Replay 250 games and record actual trump selections
        if: github.event_name == 'pull_request' && github.head_ref == 'experiment/trump-decision-distributions-250'
        timeout-minutes: 25
        run: |
          python -m benchmarks.trump_tournament --games 250 --rollouts 1024 --workers 4 --seed 20261056 --csv /tmp/replayed-250.csv --trumps-csv /tmp/trumps-250.csv | tee /tmp/replay-summary.log
          grep -q 'h2h_new_wins=130 h2h_old_wins=118 h2h_ties=2' /tmp/replay-summary.log
          python -m benchmarks.analyze_trump_choices --csv /tmp/trumps-250.csv
      - name: Archive real 250-game trump choice log
        if: github.event_name == 'pull_request' && github.head_ref == 'experiment/trump-decision-distributions-250'
        uses: actions/upload-artifact@v4
        with:
          name: trump-choices-250-game-replay
          path: |
            /tmp/trumps-250.csv
            /tmp/replayed-250.csv
          retention-days: 14
      - name: Report per-card scoring convergence
        run: |
          python -m benchmarks.score_convergence --scenario early --rollouts 16 64 256 1024 4096 --reference 8192
          python -m benchmarks.score_convergence --scenario mid --rollouts 16 64 256 1024 4096 --reference 8192

