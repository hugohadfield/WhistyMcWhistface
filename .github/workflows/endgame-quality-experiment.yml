name: Endgame quality on realistic 2-7 player states
on:
  pull_request:

jobs:
  quality:
    if: github.head_ref == 'experiment/endgame-realistic-quality-2to7'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        players: [2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run 1,000 independent game endgames with 2,048 paired hidden worlds
        run: |
          python -m benchmarks.endgame_quality --players ${{ matrix.players }} --states 1000 --rollouts 2048 --seed 20261101 --progress 100 --csv quality-${{ matrix.players }}.csv
      - name: Save per-decision paired regrets
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endgame-quality-${{ matrix.players }}-players
          path: quality-${{ matrix.players }}.csv
          if-no-files-found: warn
          retention-days: 14
